name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SimpleBar.app
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent SimpleBar.app SimpleBar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleBar
          path: SimpleBar.zip

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SimpleBar.zip \
            --title "SimpleBar (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download SimpleBar.zip, unzip, and drag SimpleBar.app into Applications."
